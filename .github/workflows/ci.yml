name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx pytest-asyncio logzero black flake8 mypy pytest-cov coverage

    - name: Check backend formatting
      run: |
        cd backend
        PYTHONPATH=.. black . --check

    - name: Lint backend code
      run: |
        cd backend
        PYTHONPATH=.. flake8 --max-line-length=120 .

    - name: Check backend types
      run: |
        cd backend
        PYTHONPATH=.. mypy --explicit-package-bases --ignore-missing-imports .

    - name: Test backend with pytest and check coverage
      run: |
        cd backend
        PYTHONPATH=.. coverage run -m pytest tests/
        PYTHONPATH=.. coverage report -m --fail-under=58

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Test frontend with Vitest
      run: |
        cd frontend
        npm run test

  automerge:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Automerge PR
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_LABELS: ""
          MERGE_METHOD: "squash"
